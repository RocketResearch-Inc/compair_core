[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compair-core"
version = "0.10.4"
description = "Open-source foundation of the Compair collaboration platform."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "RocketResearch, Inc." }
]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "celery>=5.3",
  "sqlalchemy>=2.0",
  "pgvector>=0.2",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "openai>=1.0",
  "requests>=2.31",
  "httpx>=0.27",
  "tiktoken>=0.6",
  "redis>=5.0",
  "psutil>=5.9",
  "python-Levenshtein>=0.23",
  "rfc8785==0.1.4",
  "cryptography==49.0.0",
  "redmail>=0.6",
  "python-multipart>=0.0.20",
  "xgboost>=2.1",
]

[project.scripts]
compair-core-worker = "compair_core.worker:main"
compair-core-models = "compair_core.baseline_embedding.model_cli:main"
compair-core-embedding-service = "compair_core.baseline_embedding.service:main"

[project.optional-dependencies]
dev = [
  "build>=1.0",
  "twine>=5.0",
  "pytest>=8.0",
  "ruff>=0.3",
  "scikit-learn>=1.4",
]
ocr = [
  "pillow>=10.0",
  "pytesseract>=0.3.10",
  "pypdf>=4.0",
]
postgres = [
  "psycopg2-binary>=2.9"
]
baseline-embedding = [
  "fastembed==0.8.0",
  "huggingface-hub==1.27.0",
  "numpy==2.4.6",
  "onnxruntime==1.28.0",
  "tokenizers==0.23.1",
]

[project.urls]
Homepage = "https://github.com/RocketResearch-Inc/compair_core"
Documentation = "https://github.com/RocketResearch-Inc/compair_core"
Source = "https://github.com/RocketResearch-Inc/compair_core"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "compair_core",
  "compair_core.*"
]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json"]
