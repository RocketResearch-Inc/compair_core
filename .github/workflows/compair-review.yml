name: compair-review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Check Compair configuration
        id: configuration
        shell: bash
        env:
          COMPAIR_AUTH_TOKEN: ${{ secrets.COMPAIR_AUTH_TOKEN }}
          COMPAIR_PROJECT_CONFIG_YAML_B64: ${{ secrets.COMPAIR_PROJECT_CONFIG_YAML_B64 }}
        run: |
          if [[ -n "$COMPAIR_AUTH_TOKEN" && -n "$COMPAIR_PROJECT_CONFIG_YAML_B64" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.configuration.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        if: steps.configuration.outputs.enabled == 'true'
        with:
          repository: RocketResearch-Inc/compair-cli
          ref: main
          path: compair-cli-src

      - uses: actions/setup-go@v5
        if: steps.configuration.outputs.enabled == 'true'
        with:
          go-version: "1.24.x"

      - name: Build Compair CLI
        if: steps.configuration.outputs.enabled == 'true'
        working-directory: compair-cli-src
        run: go build -o "$RUNNER_TEMP/compair" .

      - name: Restore Compair repo binding
        if: steps.configuration.outputs.enabled == 'true'
        env:
          COMPAIR_PROJECT_CONFIG_YAML_B64: ${{ secrets.COMPAIR_PROJECT_CONFIG_YAML_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/compair-state"
          printf '%s' "$COMPAIR_PROJECT_CONFIG_YAML_B64" | base64 --decode > "$RUNNER_TEMP/compair-state/project-config.yaml"

      - name: Login to Compair Cloud
        if: steps.configuration.outputs.enabled == 'true'
        env:
          COMPAIR_AUTH_TOKEN: ${{ secrets.COMPAIR_AUTH_TOKEN }}
        run: |
          "$RUNNER_TEMP/compair" --api-base https://app.compair.sh/api \
            login --token "$COMPAIR_AUTH_TOKEN"

      - name: Run advisory Compair review
        if: steps.configuration.outputs.enabled == 'true'
        env:
          COMPAIR_PROJECT_CONFIG_PATH: ${{ runner.temp }}/compair-state/project-config.yaml
        run: |
          "$RUNNER_TEMP/compair" --api-base https://app.compair.sh/api \
            sync --json --write-md .compair/compair-ci.md || true

      - name: Upload Compair report
        if: ${{ always() && steps.configuration.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: compair-feedback
          path: .compair/compair-ci.md
          if-no-files-found: ignore
